<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Interesting Reads</title>
    <meta
      name="description"
      content="Interesting Reads: a personal archive of essays, videos and posts worth your time, shelved as a 3D bookshelf you can browse, search and pull from."
    />
    <meta name="theme-color" content="#0b0b0b" />
    <meta name="color-scheme" content="dark" />

    <meta property="og:title" content="Interesting Reads" />
    <meta
      property="og:description"
      content="A personal archive of essays, videos and posts worth your time, shelved as a 3D bookshelf."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Interesting Reads" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Interesting Reads" />
    <meta
      name="twitter:description"
      content="A personal archive of essays, videos and posts worth your time, shelved as a 3D bookshelf."
    />

    <!-- the page is black from the first paint (before the stylesheet arrives) -->
    <style>html{background:#0b0b0b;color-scheme:dark}</style>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- self-hosted fonts (src/fonts.css): the headline's and the labels' faces first, so the header paints
         fast, then the faces the 3D shelf letters its spines in (baked as soon as they arrive) -->
    <link rel="preload" href="/fonts/caveat-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/architects-daughter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fraunces-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fraunces-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <script>
      // The page's height settles after load (the shelf, the desk zone, the floor band), so a
      // restored scroll position would land mid-page: always start at the top, on a reload,
      // a back/forward restore and with a shared link's hash (the read opens from there).
      try {
        history.scrollRestoration = "manual";
      } catch (e) {}
      addEventListener("pageshow", function () {
        scrollTo(0, 0);
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
